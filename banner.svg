<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rainer Schnittert, freelance developer, Fuerth Germany">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#1d1e30"/>
      <stop offset="1" stop-color="#191a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#glow)"/>

    <g stroke="#2a2c40" stroke-width="1" opacity="0.5">
      <line x1="0" y1="75" x2="1200" y2="75"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="225" x2="1200" y2="225"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="600" y1="0" x2="600" y2="300"/>
      <line x1="900" y1="0" x2="900" y2="300"/>
    </g>

    <rect x="0" y="0" width="6" height="300" fill="#7aa2f7"/>

    <text x="70" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" letter-spacing="5" fill="#7aa2f7" font-weight="600">FREELANCE DEVELOPER</text>

    <text x="68" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="64" fill="#c0caf5" font-weight="700">Rainer Schnittert</text>

    <text x="70" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#a9b1d6">Full-stack web and DevOps, based in F&#252;rth, Germany</text>

    <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="20">
      <text x="70" y="252" fill="#565f89">~</text>
      <text x="94" y="252" fill="#9ece6a">building the Fluxer ecosystem</text>
      <rect x="392" y="236" width="11" height="22" fill="#9ece6a">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(1000, 150)">
      <rect x="0"   y="-20" width="14" height="40" rx="3" fill="#7aa2f7">
        <animate attributeName="height" values="18;70;30;54;18" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-9;-35;-15;-27;-9" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="24"  y="-35" width="14" height="70" rx="3" fill="#7dcfff">
        <animate attributeName="height" values="60;22;80;34;60" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-30;-11;-40;-17;-30" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="48"  y="-45" width="14" height="90" rx="3" fill="#bb9af7">
        <animate attributeName="height" values="90;40;66;24;90" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-45;-20;-33;-12;-45" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="72"  y="-30" width="14" height="60" rx="3" fill="#9ece6a">
        <animate attributeName="height" values="40;84;28;70;40" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-20;-42;-14;-35;-20" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="96"  y="-38" width="14" height="76" rx="3" fill="#7dcfff">
        <animate attributeName="height" values="76;30;58;90;76" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-38;-15;-29;-45;-38" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="120" y="-22" width="14" height="44" rx="3" fill="#7aa2f7">
        <animate attributeName="height" values="24;64;38;80;24" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-12;-32;-19;-40;-12" dur="1.35s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
